[project]
name = "redream-ai"
version = "0.1.0"
description = "AI-assisted nightmare rescripting with safety classification"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "python-dotenv==1.0.0",
    "openai>=1.50.0",
    "groq==0.4.2",
    "langfuse==2.60.0",
    "tiktoken==0.6.0",
    "pydantic>=2.12.0",
    "httpx==0.26.0",
    "sqlalchemy>=2.0.43",
    "python-multipart>=0.0.20",
    "aiohttp>=3.13.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["AI", "safety", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
